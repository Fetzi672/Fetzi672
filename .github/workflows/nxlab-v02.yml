name: FAC NX Lab v0.2 Build

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/nxlab-v02-20260823
    paths:
      - 'nxlab-v02/**'
      - '.github/workflows/nxlab-v02.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'nxlab-v02/**'
      - '.github/workflows/nxlab-v02.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false
      - name: Install Android SDK packages
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Clone pinned engine sources
        run: |
          set -euxo pipefail
          rm -rf /tmp/autogo_scriptengine
          git clone --depth 1 --branch v0.0.22 https://github.com/ZingYao/autogo_scriptengine.git /tmp/autogo_scriptengine
          git clone https://github.com/Dasongzi1366/AutoGo.git /tmp/autogo_scriptengine/AutoGo
          cd /tmp/autogo_scriptengine/AutoGo
          git checkout d7d8087a0f892620c8340721ceee7016bc39f941
          cd /tmp/autogo_scriptengine
          mkdir -p cmd/nxlab
          cp "$GITHUB_WORKSPACE/nxlab-v02/runner/main.go" cmd/nxlab/main.go
          go mod download
      - name: Build x86_64 Android runner
        run: |
          set -euxo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p "$GITHUB_WORKSPACE/build/runner/x86_64"
          cd /tmp/autogo_scriptengine
          export GOOS=android GOARCH=amd64 CGO_ENABLED=1
          export CC="$TC/x86_64-linux-android26-clang"
          export CXX="$TC/x86_64-linux-android26-clang++"
          export CGO_LDFLAGS='-llog -landroid -ldl'
          go build -trimpath -ldflags='-s -w' -o "$GITHUB_WORKSPACE/build/runner/x86_64/nxlab-runner" ./cmd/nxlab
          file "$GITHUB_WORKSPACE/build/runner/x86_64/nxlab-runner"
          sha256sum "$GITHUB_WORKSPACE/build/runner/x86_64/nxlab-runner"
      - name: Build Android shell APK
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          AJ="$ANDROID_HOME/platforms/android-35/android.jar"
          OUT="$GITHUB_WORKSPACE/build/app"
          rm -rf "$OUT"; mkdir -p "$OUT/classes" "$OUT/dex" "$OUT/assets/runner/x86_64" "$OUT/final"
          cp "$GITHUB_WORKSPACE/build/runner/x86_64/nxlab-runner" "$OUT/assets/runner/x86_64/nxlab-runner"
          javac -source 8 -target 8 -encoding UTF-8 -classpath "$AJ" -d "$OUT/classes" \
            "$GITHUB_WORKSPACE/nxlab-v02/app/src/fac/nxlab/MainActivity.java" \
            "$GITHUB_WORKSPACE/nxlab-v02/app/src/fac/nxlab/ScanService.java" \
            "$GITHUB_WORKSPACE/nxlab-v02/app/src/fac/nxlab/MatchOverlayView.java"
          (cd "$OUT/classes" && jar cf "$OUT/classes.jar" .)
          "$BT/d8" --lib "$AJ" --min-api 26 --output "$OUT/dex" "$OUT/classes.jar"
          "$BT/aapt2" link -o "$OUT/base.apk" -I "$AJ" --manifest "$GITHUB_WORKSPACE/nxlab-v02/app/AndroidManifest.xml" --min-sdk-version 26 --target-sdk-version 30 -A "$OUT/assets"
          cp "$OUT/base.apk" "$OUT/unsigned.apk"
          (cd "$OUT/dex" && zip -q "$OUT/unsigned.apk" classes.dex)
          "$BT/zipalign" -p -f 4 "$OUT/unsigned.apk" "$OUT/aligned.apk"
          PASS="$(openssl rand -hex 20)"
          keytool -genkeypair -noprompt -keystore "$OUT/key.jks" -storepass "$PASS" -keypass "$PASS" -alias nxlab -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=FAC NX Lab v0.2 Test,O=FAC' >/dev/null 2>&1
          "$BT/apksigner" sign --ks "$OUT/key.jks" --ks-key-alias nxlab --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out "$OUT/final/FAC_NX_Lab_v0.2_x86_64_shell.apk" "$OUT/aligned.apk"
          "$BT/apksigner" verify --verbose "$OUT/final/FAC_NX_Lab_v0.2_x86_64_shell.apk"
          unzip -t "$OUT/final/FAC_NX_Lab_v0.2_x86_64_shell.apk"
          rm -f "$OUT/key.jks"
      - name: Build report
        run: |
          APK="$GITHUB_WORKSPACE/build/app/final/FAC_NX_Lab_v0.2_x86_64_shell.apk"
          RUNNER="$GITHUB_WORKSPACE/build/runner/x86_64/nxlab-runner"
          {
            echo 'FAC NX Lab v0.2 shell build'
            echo '==========================='; echo
            echo 'Target: x86_64 / MuMu'; echo 'Android minSdk: 26'; echo 'Auto-tap: disabled in scan mode'
            echo 'Features: multi-template scan protocol, floating stop bubble, bottom-right progress, center status, red match rectangle and arrow'
            echo 'NOTE: user-supplied Aiwan template PNG assets are intentionally injected after CI and are not committed to the repository.'
            echo "Runner SHA-256: $(sha256sum "$RUNNER" | awk '{print $1}')"
            echo "Shell APK SHA-256: $(sha256sum "$APK" | awk '{print $1}')"
          } > "$GITHUB_WORKSPACE/build/app/final/BUILD_REPORT.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: FAC-NX-Lab-v0.2-x86_64-shell
          path: build/app/final/*
          if-no-files-found: error
