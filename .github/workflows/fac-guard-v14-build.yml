name: FAC Guard V14 Build

on:
  push:
    branches: [ "chatgpt/fac-apk-toolchain-20260818" ]
    paths:
      - 'fac-guard-android/**'
      - '.github/workflows/fac-guard-v14-build.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'fac-guard-android/**'
      - '.github/workflows/fac-guard-v14-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build FAC Guard V14 APK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -maxdepth 2 -name android.jar | sort -V | tail -1)
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          AAPT2="$BUILD_TOOLS/aapt2"
          D8="$BUILD_TOOLS/d8"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          rm -rf fac-guard-android/out fac-guard-android/dist
          mkdir -p fac-guard-android/out/classes fac-guard-android/out/dex fac-guard-android/dist

          javac -source 8 -target 8 -encoding UTF-8 \
            -cp "$ANDROID_JAR" \
            -d fac-guard-android/out/classes \
            $(find fac-guard-android/src -name '*.java' -print)

          "$D8" --min-api 23 --lib "$ANDROID_JAR" \
            --output fac-guard-android/out/dex \
            $(find fac-guard-android/out/classes -name '*.class' -print)
          test -s fac-guard-android/out/dex/classes.dex

          "$AAPT2" link \
            -I "$ANDROID_JAR" \
            --manifest fac-guard-android/AndroidManifest.xml \
            --min-sdk-version 23 \
            --target-sdk-version 28 \
            --version-code 14 \
            --version-name 14.0 \
            -o fac-guard-android/out/base.apk

          cp fac-guard-android/out/base.apk fac-guard-android/out/unaligned.apk
          (cd fac-guard-android/out/dex && zip -q -j ../unaligned.apk classes.dex)
          "$ZIPALIGN" -f 4 fac-guard-android/out/unaligned.apk fac-guard-android/out/aligned.apk

          PASS=$(openssl rand -hex 24)
          keytool -genkeypair -noprompt \
            -keystore fac-guard-android/out/fac-guard-v14-test.jks \
            -storepass "$PASS" -keypass "$PASS" \
            -alias facguard -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=FAC Guard V14 Test,O=FAC"

          "$APKSIGNER" sign \
            --ks fac-guard-android/out/fac-guard-v14-test.jks \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out fac-guard-android/dist/FAC_Guard_v14.apk \
            fac-guard-android/out/aligned.apk

          "$APKSIGNER" verify --verbose --print-certs fac-guard-android/dist/FAC_Guard_v14.apk
          "$AAPT2" dump badging fac-guard-android/dist/FAC_Guard_v14.apk | head -20
          sha256sum fac-guard-android/dist/FAC_Guard_v14.apk | tee fac-guard-android/dist/FAC_Guard_v14.sha256
          cp fac-guard-android/README.md fac-guard-android/dist/README.md

          cat > fac-guard-android/dist/BUILD_INFO.txt <<'EOF'
          FAC Guard V14
          Guard package: fac.guard
          Protected package: com.cocfz.com.freescript
          Original APK modification: NONE
          Root monitor interval: ~0.5 seconds
          Boot receiver: enabled when armed
          Root keepalive: /data/local/tmp/fac_guard_v14_keepalive.sh
          License endpoint: https://fac.fetzi-ai.de/api/android/licenses/verify
          License appVersion: 310.0
          Local expiry check: 30 seconds
          Server recheck: 5 minutes
          Guard policy: fail closed
          EOF

      - name: Upload FAC Guard V14
        uses: actions/upload-artifact@v4
        with:
          name: FAC-Guard-v14
          path: fac-guard-android/dist/*
          if-no-files-found: error
