name: FAC Guard V15.2.3 ImGui Build

on:
  push:
    branches: [ "chatgpt/fac-apk-toolchain-20260818" ]
    paths:
      - 'fac-guard-android/**'
      - '.github/workflows/fac-guard-v14-build.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'fac-guard-android/**'
      - '.github/workflows/fac-guard-v14-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build FAC Guard V15.2.3 ImGui shell
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -maxdepth 2 -name android.jar | sort -V | tail -1)
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          NDK=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          AAPT2="$BUILD_TOOLS/aapt2"
          D8="$BUILD_TOOLS/d8"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          rm -rf fac-guard-android/out fac-guard-android/dist
          mkdir -p fac-guard-android/out/classes fac-guard-android/out/dex fac-guard-android/out/apk-root/lib fac-guard-android/out/compiled-res fac-guard-android/dist

          javac -source 8 -target 8 -encoding UTF-8 \
            -cp "$ANDROID_JAR" \
            -d fac-guard-android/out/classes \
            $(find fac-guard-android/src -name '*.java' -print)

          "$D8" --min-api 23 --lib "$ANDROID_JAR" \
            --output fac-guard-android/out/dex \
            $(find fac-guard-android/out/classes -name '*.class' -print)
          test -s fac-guard-android/out/dex/classes.dex

          git clone --depth 1 https://github.com/ocornut/imgui.git fac-guard-android/out/imgui-src
          git clone --depth 1 https://github.com/patrickcjk/imgui-notify.git fac-guard-android/out/imgui-notify-src
          IMGUI_SHA=$(git -C fac-guard-android/out/imgui-src rev-parse HEAD)
          NOTIFY_SHA=$(git -C fac-guard-android/out/imgui-notify-src rev-parse HEAD)
          echo "Dear ImGui commit: $IMGUI_SHA"
          echo "imgui-notify commit: $NOTIFY_SHA"

          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            B="fac-guard-android/out/native-$ABI"
            cmake -S fac-guard-android/native -B "$B" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-23 \
              -DCMAKE_BUILD_TYPE=Release \
              -DIMGUI_DIR="$GITHUB_WORKSPACE/fac-guard-android/out/imgui-src" \
              -DIMGUI_NOTIFY_DIR="$GITHUB_WORKSPACE/fac-guard-android/out/imgui-notify-src"
            cmake --build "$B" --config Release
            mkdir -p "fac-guard-android/out/apk-root/lib/$ABI"
            cp "$B/libfacui.so" "fac-guard-android/out/apk-root/lib/$ABI/libfacui.so"
          done

          "$AAPT2" compile --dir fac-guard-android/res -o fac-guard-android/out/compiled-res
          mapfile -t RES_FILES < <(find fac-guard-android/out/compiled-res -type f -name '*.flat' -print | sort)

          "$AAPT2" link \
            -I "$ANDROID_JAR" \
            --manifest fac-guard-android/AndroidManifest.xml \
            --min-sdk-version 23 \
            --target-sdk-version 28 \
            --version-code 1523 \
            --version-name 15.2.3 \
            "${RES_FILES[@]}" \
            -o fac-guard-android/out/base.apk

          cp fac-guard-android/out/base.apk fac-guard-android/out/unaligned.apk
          (cd fac-guard-android/out/dex && zip -q -j ../unaligned.apk classes.dex)
          (cd fac-guard-android/out/apk-root && zip -q -r ../unaligned.apk lib)
          "$ZIPALIGN" -f 4 fac-guard-android/out/unaligned.apk fac-guard-android/out/aligned.apk

          PASS=$(openssl rand -hex 24)
          keytool -genkeypair -noprompt \
            -keystore fac-guard-android/out/fac-guard-v15-2-3-test.jks \
            -storepass "$PASS" -keypass "$PASS" \
            -alias facguard -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=FAC Guard V15.2.3 Test,O=FAC"

          "$APKSIGNER" sign \
            --ks fac-guard-android/out/fac-guard-v15-2-3-test.jks \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out fac-guard-android/dist/FAC_Guard_v15_2_3_shell.apk \
            fac-guard-android/out/aligned.apk

          "$APKSIGNER" verify --verbose --print-certs fac-guard-android/dist/FAC_Guard_v15_2_3_shell.apk
          "$AAPT2" dump badging fac-guard-android/dist/FAC_Guard_v15_2_3_shell.apk | head -25
          sha256sum fac-guard-android/dist/FAC_Guard_v15_2_3_shell.apk | tee fac-guard-android/dist/FAC_Guard_v15_2_3_shell.sha256
          printf '%s\n' "$IMGUI_SHA" > fac-guard-android/dist/IMGUI_COMMIT.txt
          printf '%s\n' "$NOTIFY_SHA" > fac-guard-android/dist/IMGUI_NOTIFY_COMMIT.txt
          cp fac-guard-android/out/imgui-notify-src/LICENSE fac-guard-android/dist/IMGUI_NOTIFY_LICENSE.txt

          cat > fac-guard-android/dist/BUILD_INFO.txt <<EOF
          FAC Guard V15.2.3 ImGui shell
          Guard package: fac.guard
          Protected package: com.cocfz.com.freescript
          Native UI: Dear ImGui + OpenGL ES 3 + imgui-notify
          ABIs: armeabi-v7a, arm64-v8a, x86, x86_64
          Dear ImGui commit: $IMGUI_SHA
          imgui-notify commit: $NOTIFY_SHA
          Closed-state SAW: no fullscreen overlay; toast-only bounded window
          English text masks: trusted TYPE_ACCESSIBILITY_OVERLAY + FLAG_NOT_TOUCHABLE
          Interactive panel: bounded + FLAG_NOT_TOUCH_MODAL
          ImGui Settings tab: panel width, panel height, UI scale
          Title-bar close button: enabled
          Bubble artwork asset: injected after CI as assets/fac/fac_bubble.jpg
          Runtime staging hard timeout: 20 seconds including stdin transfer
          Package Manager hard timeout: 30 seconds per install path
          Package Manager fallback: cmd package install
          Bot settings path: /storage/emulated/0/uix/zh1.txt
          Launcher visibility: setup-only alias, auto-hidden after successful authorization
          Payload asset: injected after CI as assets/fac_runtime.bin
          Bot schema asset: injected after CI as assets/fac/bot_config_schema.json
          Translation map asset: injected after CI as assets/fac/text_map.tsv
          Original runtime modification: NONE
          EOF

      - name: Upload FAC Guard V15.2.3 shell
        uses: actions/upload-artifact@v4
        with:
          name: FAC-Guard-v15-2-3-shell
          path: fac-guard-android/dist/*
          if-no-files-found: error
