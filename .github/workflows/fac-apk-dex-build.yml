name: FAC APK DEX Build
on:
  push:
    branches: [ "chatgpt/fac-apk-toolchain-20260818" ]
    paths:
      - 'fac-apk-build/**'
      - 'fac-loader-android/**'
      - '.github/workflows/fac-apk-dex-build.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'fac-apk-build/**'
      - 'fac-loader-android/**'
      - '.github/workflows/fac-apk-dex-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Java against Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -maxdepth 2 -name android.jar | sort -V | tail -1)
          echo "Using $ANDROID_JAR"
          rm -rf fac-apk-build/out
          mkdir -p fac-apk-build/out/stubclasses fac-apk-build/out/classes fac-apk-build/out/dex

          # Compile-only stubs. Their real implementations are supplied by the
          # untouched original APK/runtime and MUST NOT enter classes2.dex.
          javac -source 8 -target 8 -encoding UTF-8 -cp "$ANDROID_JAR" \
            -d fac-apk-build/out/stubclasses \
            $(find fac-apk-build/stubs -name '*.java' -print)

          # V11 deliberately compiles only the minimum licensing surface.
          javac -source 8 -target 8 -encoding UTF-8 \
            -cp "$ANDROID_JAR:fac-apk-build/out/stubclasses" \
            -d fac-apk-build/out/classes \
            fac-apk-build/src/fac/license/DeviceIdentity.java \
            fac-apk-build/src/fac/license/ui/LicenseActivity.java \
            fac-apk-build/src/fac/license/runtime/FacAppComponentFactoryX.java \
            fac-apk-build/src/fac/license/runtime/LicenseRuntimeGuard.java

          D8=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name d8 | sort -V | tail -1)
          echo "Using $D8"
          "$D8" --min-api 16 --lib "$ANDROID_JAR" \
            --classpath fac-apk-build/out/stubclasses \
            --output fac-apk-build/out/dex \
            $(find fac-apk-build/out/classes -name '*.class' -print)

          test -s fac-apk-build/out/dex/classes.dex
          python3 - <<'PY'
          import struct
          p='fac-apk-build/out/dex/classes.dex'
          d=open(p,'rb').read()
          ss,so=struct.unpack_from('<II',d,0x38)
          ts,to=struct.unpack_from('<II',d,0x40)
          cs,co=struct.unpack_from('<II',d,0x60)
          def uleb(o):
              v=s=0
              while True:
                  b=d[o];o+=1;v|=(b&127)<<s
                  if b<128:return v,o
                  s+=7
          def st(i):
              o=struct.unpack_from('<I',d,so+4*i)[0];_,o=uleb(o);e=d.index(b'\0',o);return d[o:e].decode('utf-8','replace')
          strings_=[st(i) for i in range(ss)]
          types=[strings_[struct.unpack_from('<I',d,to+4*i)[0]] for i in range(ts)]
          defs=[]
          for i in range(cs):
              ci=struct.unpack_from('<I',d,co+32*i)[0];defs.append(types[ci])
          assert 'Lcom/nx/main/App;' not in defs, 'com.nx compile stub leaked into classes2.dex'
          assert 'Landroid/support/v4/app/CoreComponentFactory;' not in defs, 'support compile stub leaked into classes2.dex'
          assert 'Lfac/license/DeviceIdentity;' in defs
          assert 'Lfac/license/ui/LicenseActivity;' in defs
          assert 'Lfac/license/runtime/FacAppComponentFactoryX;' in defs
          assert 'Lfac/license/runtime/LicenseRuntimeGuard;' in defs
          forbidden=[x for x in defs if x.startswith('Lfac/license/overlay/') or x in {
              'Lfac/license/FacApplication;','Lfac/license/LicenseGateProvider;','Lfac/license/SessionHandoff;','Lfac/license/ui/BotSettingsActivity;'}]
          assert not forbidden, 'V11 slim DEX contains legacy classes: '+repr(forbidden)
          print('V11 slim DEX class integrity OK')
          PY
          sha256sum fac-apk-build/out/dex/classes.dex
      - name: Upload DEX
        uses: actions/upload-artifact@v4
        with:
          name: fac-license-classes2-dex
          path: fac-apk-build/out/dex/classes.dex
          if-no-files-found: error

      - name: Build standalone FAC Loader V12 APK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -maxdepth 2 -name android.jar | sort -V | tail -1)
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          AAPT2="$BUILD_TOOLS/aapt2"
          D8="$BUILD_TOOLS/d8"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          rm -rf fac-loader-android/out fac-loader-android/dist
          mkdir -p fac-loader-android/out/classes fac-loader-android/out/dex fac-loader-android/dist

          javac -source 8 -target 8 -encoding UTF-8 \
            -cp "$ANDROID_JAR" \
            -d fac-loader-android/out/classes \
            $(find fac-loader-android/src -name '*.java' -print)

          "$D8" --min-api 23 --lib "$ANDROID_JAR" \
            --output fac-loader-android/out/dex \
            $(find fac-loader-android/out/classes -name '*.class' -print)
          test -s fac-loader-android/out/dex/classes.dex

          "$AAPT2" link \
            -I "$ANDROID_JAR" \
            --manifest fac-loader-android/AndroidManifest.xml \
            --min-sdk-version 23 \
            --target-sdk-version 28 \
            --version-code 12 \
            --version-name 12.0 \
            -o fac-loader-android/out/base.apk

          cp fac-loader-android/out/base.apk fac-loader-android/out/unaligned.apk
          (cd fac-loader-android/out/dex && zip -q -j ../unaligned.apk classes.dex)
          "$ZIPALIGN" -f 4 fac-loader-android/out/unaligned.apk fac-loader-android/out/aligned.apk

          PASS=$(openssl rand -hex 24)
          keytool -genkeypair -noprompt \
            -keystore fac-loader-android/out/fac-loader-test.jks \
            -storepass "$PASS" -keypass "$PASS" \
            -alias facloader -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=FAC Loader V12 Test,O=FAC"

          "$APKSIGNER" sign \
            --ks fac-loader-android/out/fac-loader-test.jks \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out fac-loader-android/dist/FAC_Loader_v12.apk \
            fac-loader-android/out/aligned.apk
          "$APKSIGNER" verify --verbose --print-certs fac-loader-android/dist/FAC_Loader_v12.apk
          "$AAPT2" dump badging fac-loader-android/dist/FAC_Loader_v12.apk | head -20
          sha256sum fac-loader-android/dist/FAC_Loader_v12.apk | tee fac-loader-android/dist/FAC_Loader_v12.sha256
          cp fac-loader-android/README.md fac-loader-android/dist/README.md
          cat > fac-loader-android/dist/BUILD_INFO.txt <<'EOF'
          FAC Loader V12
          Target original package: com.cocfz.com.freescript
          Original APK modification: NONE
          License endpoint: https://fac.fetzi-ai.de/api/android/licenses/verify
          License appVersion: 310.0
          Local expiry check: 30 seconds
          Server recheck: 5 minutes
          Guard policy: fail closed, root force-stop original package
          Direct-launch hardening: intentionally deferred until runtime compatibility is confirmed
          EOF

      - name: Upload FAC Loader V12
        uses: actions/upload-artifact@v4
        with:
          name: FAC-Loader-v12
          path: fac-loader-android/dist/*
          if-no-files-found: error
