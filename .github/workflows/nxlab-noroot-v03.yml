name: FAC NX Lab Non-Root v0.3 Build

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/nxlab-noroot-v03-20260823
    paths:
      - 'nxlab-noroot-v03/**'
      - '.github/workflows/nxlab-noroot-v03.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'nxlab-noroot-v03/**'
      - '.github/workflows/nxlab-noroot-v03.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build Java APK shell
        shell: bash
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          AJ="$ANDROID_HOME/platforms/android-35/android.jar"
          SRC="$GITHUB_WORKSPACE/nxlab-noroot-v03/app"
          OUT="$GITHUB_WORKSPACE/build/noroot"
          rm -rf "$OUT"
          mkdir -p "$OUT/classes" "$OUT/dex" "$OUT/assets/templates" "$OUT/final"

          javac -source 8 -target 8 -encoding UTF-8 \
            -classpath "$AJ" \
            -d "$OUT/classes" \
            "$SRC/src/fac/nxlab/noroot/MainActivity.java" \
            "$SRC/src/fac/nxlab/noroot/ScanService.java" \
            "$SRC/src/fac/nxlab/noroot/MatchOverlayView.java"

          (cd "$OUT/classes" && jar cf "$OUT/classes.jar" .)
          "$BT/d8" --lib "$AJ" --min-api 26 --output "$OUT/dex" "$OUT/classes.jar"

          echo 'Templates are injected only into the final local test artifact.' > "$OUT/assets/templates/README.txt"

          "$BT/aapt2" link \
            -o "$OUT/base.apk" \
            -I "$AJ" \
            --manifest "$SRC/AndroidManifest.xml" \
            --min-sdk-version 26 \
            --target-sdk-version 35 \
            --version-code 3 \
            --version-name 0.3 \
            -A "$OUT/assets"

          cp "$OUT/base.apk" "$OUT/unsigned.apk"
          (cd "$OUT/dex" && zip -q "$OUT/unsigned.apk" classes.dex)
          "$BT/zipalign" -p -f 4 "$OUT/unsigned.apk" "$OUT/aligned.apk"

          PASS="$(openssl rand -hex 20)"
          keytool -genkeypair -noprompt \
            -keystore "$OUT/test.jks" -storepass "$PASS" -keypass "$PASS" \
            -alias nxlab -keyalg RSA -keysize 2048 -validity 3650 \
            -dname 'CN=FAC NX Lab Non-Root v0.3 Test,O=FAC' >/dev/null 2>&1

          "$BT/apksigner" sign \
            --ks "$OUT/test.jks" --ks-key-alias nxlab \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out "$OUT/final/FAC_NX_Lab_NonRoot_v0.3_shell.apk" \
            "$OUT/aligned.apk"

          "$BT/apksigner" verify --verbose "$OUT/final/FAC_NX_Lab_NonRoot_v0.3_shell.apk"
          unzip -t "$OUT/final/FAC_NX_Lab_NonRoot_v0.3_shell.apk"
          rm -f "$OUT/test.jks"

      - name: Build report
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$GITHUB_WORKSPACE/build/noroot/final"
          APK="$OUT/FAC_NX_Lab_NonRoot_v0.3_shell.apk"
          {
            echo 'FAC NX Lab Non-Root v0.3 shell build'
            echo '======================================='
            echo 'Screenshot backend: Android MediaProjection + ImageReader'
            echo 'Root required: NO'
            echo 'Overlay: TYPE_APPLICATION_OVERLAY (user-granted permission)'
            echo 'Foreground service type: mediaProjection'
            echo 'Auto tap: disabled'
            echo 'Templates: intentionally injected after CI build'
            echo "APK SHA-256: $(sha256sum "$APK" | awk '{print $1}')"
          } > "$OUT/BUILD_REPORT.txt"
          sha256sum "$APK" > "$OUT/FAC_NX_Lab_NonRoot_v0.3_shell.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: FAC-NX-Lab-NonRoot-v0.3-shell
          path: build/noroot/final/*
          if-no-files-found: error
